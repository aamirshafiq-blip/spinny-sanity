name: Spinny PLP Sanity

on:
  schedule:
    # 8am, 12pm, 3pm IST = 2:30, 6:30, 9:30 UTC
    - cron: '30 2,6,9 * * *'
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npx playwright test
        continue-on-error: true

      - name: Generate report & zip
        id: report
        run: |
          OUTPUT=$(node scripts/generate-report.js)
          echo "$OUTPUT"
          REPORT_DIR=$(echo "$OUTPUT" | grep "^REPORT_DIR=" | cut -d= -f2 | tr -d '\r')
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
          zip -r "${REPORT_DIR}.zip" "$REPORT_DIR/"
          echo "ZIP_PATH=${REPORT_DIR}.zip" >> $GITHUB_ENV

      - name: Write Drive credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.DRIVE_CREDENTIALS }}' > credentials/oauth-client.json
          echo '${{ secrets.DRIVE_TOKEN }}' > credentials/drive-token.json

      - name: Upload to Google Drive
        run: |
          RUN_LABEL=$(node -e "const m=require('./${{ env.REPORT_DIR }}/meta.json');process.stdout.write(m.runLabel)")
          node scripts/upload-drive.js "${{ env.ZIP_PATH }}" "Spinny PLP Sanity ${RUN_LABEL}.zip" "${{ env.REPORT_DIR }}/drive-link.txt"
        continue-on-error: true

      - name: Send Slack report
        run: node scripts/send-slack.js
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

      - name: Cleanup old Drive reports (keep 7 days)
        run: node scripts/cleanup-drive.js 7
        continue-on-error: true

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plp-sanity-${{ github.run_number }}
          path: reports/
          retention-days: 14
